buildscript {
    repositories {
        maven { url = "https://files.minecraftforge.net/maven" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.3.20"
group = "com.tlp.srptweaks"
archivesBaseName = "SRPTweaks"

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
}

minecraft {
    version = "1.12.2-14.23.5.2847"
    runDir = "run"
    
    // the mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   snapshot are built nightly.
    // stable_#            stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // simply re-run your setup task after changing the mappings to update your workspace.
    mappings = "stable_39"
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
}

repositories {
    maven {
        url = 'https://repo.spongepowered.org/maven'
        url = "https://cursemaven.com"
    }
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.7'
    implementation 'curse.maven:hbms-nuclear-tech-mod-extended-edition-708939:7234087'

    compile files("libs/SRParasites-1.12.2v1.9.21.jar")
    compile files("libs/SimpleDifficulty-1.12.2-0.7.0.jar")
    compile files("libs/!mixinbooter-10.7.jar")
    compile files("libs/DynamicLights-1.12.2.jar")
    compile files("libs/AdvancedRocketry-1.12.2-2.2.1-1.jar")
    compile files("libs/B3M-1.12.2-20.jar")
    compile files("libs/DynamicSurroundings-1.12.2-3.6.3-fix.jar")
    compile files("libs/soundphysics-1.1.15.jar")
    compile files("libs/Bountiful Baubles-1.12.2-0.1.8.jar")
    compile files("libs/TinkerSurvival-1.12.2-1.2.3.2.jar")
    compile files("libs/SRPCalamity-1.12.2-v0.3.0.jar")
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else except the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
                "FMLCorePlugin": "com.tlp.srptweaks.SRPTweaksPlugin",
                "FMLCorePluginContainsFMLMod": "true"
        )
    }
}